name: Advisories

# Every day, the advisories on Chroma and on the dependencies of what the release builds, against the ids already looked
# at in .github/advisories-seen.txt (see .github/scripts/advisories.py). A new advisory fails the job, and so does a
# database that cannot be read: GitHub sends an email about it. On a pull request that changes those dependencies, only
# the dependencies: the job fails if the pull request brings an advisory that the base branch does not have.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - Cargo.lock
      - pyproject.toml
      - .github/advisories-seen.txt
      - .github/scripts/advisories.py
      - .github/workflows/advisories.yml

permissions: {}

jobs:
  advisories:
    name: Advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # On a pull request, HEAD^1 is the head of the base branch.
          fetch-depth: 2
      - name: osv-scanner 2.7.0
        run: |
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: New advisories
        env:
          GH_TOKEN: ${{ github.token }}
          OSV_SCANNER: ${{ runner.temp }}/osv-scanner
          PULL_REQUEST: ${{ github.event_name == 'pull_request' && '--pull-request' || '' }}
        run: python3 .github/scripts/advisories.py $PULL_REQUEST
