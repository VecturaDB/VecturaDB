# Build and test only: nothing is published, no secrets are needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version of the wheels, from the release tag. Empty in CI.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  cli-linux:
    name: CLI Linux ${{ matrix.arch }} (glibc 2.17)
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-24.04
    steps:
      - name: Machine
        shell: bash
        continue-on-error: true
        run: |
          case "$RUNNER_OS" in
            Linux) lscpu | grep -E '^(Model name|CPU\(s\)|Thread\(s\) per core|Core\(s\) per socket|Socket\(s\)):' ;;
            macOS) sysctl -n machdep.cpu.brand_string; sysctl hw.physicalcpu hw.logicalcpu ;;
            Windows) powershell -NoProfile -Command "Get-CimInstance Win32_Processor | Format-List Name,NumberOfCores,NumberOfLogicalProcessors" ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CLI version from the release tag
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: perl -0pi -e 's/^version = ".*"/version = "$ENV{VERSION}"/m' rust/cli/Cargo.toml && grep -m1 '^version' rust/cli/Cargo.toml
      - uses: ./.github/actions/rust
        with:
          github-token: ${{ github.token }}
          targets: ${{ matrix.arch }}-unknown-linux-gnu
          install-nextest: "false"
      - run: pip install "cargo-zigbuild==0.23.4" "ziglang==0.13.0"
      - run: cargo zigbuild --bin vecturadb --release --manifest-path rust/cli/Cargo.toml --target ${{ matrix.arch }}-unknown-linux-gnu.2.17
      - run: cp target/${{ matrix.arch }}-unknown-linux-gnu/release/vecturadb vecturadb-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-linux-${{ matrix.arch }}
          path: vecturadb-linux-${{ matrix.arch }}

  cli-windows:
    name: CLI Windows x64
    runs-on: windows-latest
    steps:
      - name: Machine
        shell: bash
        continue-on-error: true
        run: |
          case "$RUNNER_OS" in
            Linux) lscpu | grep -E '^(Model name|CPU\(s\)|Thread\(s\) per core|Core\(s\) per socket|Socket\(s\)):' ;;
            macOS) sysctl -n machdep.cpu.brand_string; sysctl hw.physicalcpu hw.logicalcpu ;;
            Windows) powershell -NoProfile -Command "Get-CimInstance Win32_Processor | Format-List Name,NumberOfCores,NumberOfLogicalProcessors" ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CLI version from the release tag
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: perl -0pi -e 's/^version = ".*"/version = "$ENV{VERSION}"/m' rust/cli/Cargo.toml && grep -m1 '^version' rust/cli/Cargo.toml
      - uses: ./.github/actions/rust
        with:
          github-token: ${{ github.token }}
          install-nextest: "false"
      - run: cargo build --bin vecturadb --release --manifest-path rust/cli/Cargo.toml
      - run: copy target\release\vecturadb.exe vecturadb-windows-x64.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-windows-x64
          path: vecturadb-windows-x64.exe
      # The tests of the local HNSW that only Windows runs: data paths at the limit of MAX_PATH.
      - run: cargo test --release -p chroma-segment --lib on_windows

  cli-macos:
    name: CLI macOS ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, name: arm64 }
          - { target: x86_64-apple-darwin, name: x64 }
    runs-on: macos-15
    steps:
      - name: Machine
        shell: bash
        continue-on-error: true
        run: |
          case "$RUNNER_OS" in
            Linux) lscpu | grep -E '^(Model name|CPU\(s\)|Thread\(s\) per core|Core\(s\) per socket|Socket\(s\)):' ;;
            macOS) sysctl -n machdep.cpu.brand_string; sysctl hw.physicalcpu hw.logicalcpu ;;
            Windows) powershell -NoProfile -Command "Get-CimInstance Win32_Processor | Format-List Name,NumberOfCores,NumberOfLogicalProcessors" ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CLI version from the release tag
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: perl -0pi -e 's/^version = ".*"/version = "$ENV{VERSION}"/m' rust/cli/Cargo.toml && grep -m1 '^version' rust/cli/Cargo.toml
      - uses: ./.github/actions/rust
        with:
          github-token: ${{ github.token }}
          targets: ${{ matrix.target }}
          install-nextest: "false"
      - run: cargo build --bin vecturadb --release --manifest-path rust/cli/Cargo.toml --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/vecturadb vecturadb-macos-${{ matrix.name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-macos-${{ matrix.name }}
          path: vecturadb-macos-${{ matrix.name }}

  wheels:
    name: Wheel ${{ matrix.os }} ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, runner: ubuntu-24.04-arm, target: aarch64 }
          - { os: windows, runner: windows-latest, target: x64 }
          - { os: macos, runner: macos-15, target: x86_64 }
          - { os: macos, runner: macos-15, target: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps: &wheel-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: CLI version from the release tag
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: perl -0pi -e 's/^version = ".*"/version = "$ENV{VERSION}"/m' rust/cli/Cargo.toml && grep -m1 '^version' rust/cli/Cargo.toml
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Python protos, as idl/makefile proto_python
        shell: bash
        run: |
          pip install grpcio==1.58.0 grpcio-tools==1.58.0
          cd idl && python -m grpc_tools.protoc -I ./ --python_out=. --pyi_out=. --grpc_python_out=. ./chromadb/proto/*.proto
          mv chromadb/proto/*.py ../chromadb/proto/ && mv chromadb/proto/*.pyi ../chromadb/proto/
      - name: Version in pyproject.toml, as the release of Chroma
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          pip install setuptools_scm toml packaging
          # PEP 440 form of the tag: 1.0.0-preview.1 becomes 1.0.0rc1
          version=$(python -c "import sys; from packaging.version import Version; print(Version(sys.argv[1]))" "${VERSION:-$(python -m setuptools_scm)}")
          python -c "import toml; d = toml.load('pyproject.toml'); d['project']['version'] = '$version'; d['project']['dynamic'] = []; toml.dump(d, open('pyproject.toml', 'w'))"
          echo "Version: $version"
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ github.token }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist ${{ matrix.os == 'linux' && '--zig --compatibility manylinux2014' || '' }}
          container: "off"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  # The wheel that the Python tests install, in a job of its own: they wait for it, not for the other wheels.
  wheel-linux-x86_64:
    name: Wheel ${{ matrix.os }} ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - { os: linux, runner: ubuntu-24.04, target: x86_64 }
    runs-on: ${{ matrix.runner }}
    steps: *wheel-steps

  # The image of each architecture, from the source as release.yml builds it and as Chroma builds its official one, each
  # on a runner of its own: this job amd64, image-arm64 arm64, with the same steps.
  image:
    name: Docker image (built, not pushed)
    runs-on: ubuntu-24.04
    env:
      ARCH: amd64
    steps: &image-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CLI version from the release tag
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: perl -0pi -e 's/^version = ".*"/version = "$ENV{VERSION}"/m' rust/cli/Cargo.toml && grep -m1 '^version' rust/cli/Cargo.toml
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build as a release does
        run: >-
          docker buildx build --platform "linux/$ARCH" -f vecturadb/docker/Dockerfile
          --build-arg REVISION=${{ github.sha }} --load -t ghcr.io/vecturadb/vecturadb:ci .
      - name: The version of the release tag in the image
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: docker run --rm ghcr.io/vecturadb/vecturadb:ci --version | tee /dev/stderr | grep -qx "vecturadb $VERSION"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install chromadb-client
      - name: Smoke test with the Python client
        run: |
          docker run -d --name vecturadb -p 127.0.0.1:8000:8000 ghcr.io/vecturadb/vecturadb:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/v2/heartbeat && break; sleep 2; done
          python vecturadb/smoke.py 8000
      - if: failure()
        run: docker logs vecturadb
      # The image of amd64 as an artifact, to measure it as the image of a release, without building it again. Not in a
      # release: github-release publishes every artifact of the run, and the image of a release goes to ghcr.io.
      - name: Save the image
        if: inputs.version == '' && env.ARCH == 'amd64'
        run: docker save ghcr.io/vecturadb/vecturadb:ci | gzip > vecturadb-image-amd64.tar.gz
      - if: inputs.version == '' && env.ARCH == 'amd64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vecturadb-image-amd64
          path: vecturadb-image-amd64.tar.gz
          retention-days: 14

  image-arm64:
    name: Docker image arm64 (built, not pushed)
    runs-on: ubuntu-24.04-arm
    env:
      ARCH: arm64
    steps: *image-steps

  rust-tests:
    name: Rust tests (single-node)
    runs-on: ubuntu-24.04
    env:
      RUST_BACKTRACE: 1
      RUST_MIN_STACK_SIZE: 8388608
    steps:
      - name: Machine
        shell: bash
        continue-on-error: true
        run: |
          case "$RUNNER_OS" in
            Linux) lscpu | grep -E '^(Model name|CPU\(s\)|Thread\(s\) per core|Core\(s\) per socket|Socket\(s\)):' ;;
            macOS) sysctl -n machdep.cpu.brand_string; sysctl hw.physicalcpu hw.logicalcpu ;;
            Windows) powershell -NoProfile -Command "Get-CimInstance Win32_Processor | Format-List Name,NumberOfCores,NumberOfLogicalProcessors" ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          github-token: ${{ github.token }}
      - name: Test
        run: >-
          cargo nextest run --profile ci
          -p chroma-cli -p chroma-frontend -p frontend-core -p chroma-sqlite -p chroma-sysdb -p chroma-log
          -p chroma-segment -p chroma-index -p chroma-types -p chroma-distance -p chromadb_rust_bindings
      - name: Worker tests of the operators shared with the single node
        # rank, ranked_group_by and select call the code moved to chroma-types; the rest of the worker is not single-node
        run: >-
          cargo nextest run --profile ci -p worker --lib
          -E 'test(/^execution::operators::(rank|ranked_group_by|select)::tests::/)'

  python-tests:
    name: Python tests (single-node)
    needs: wheel-linux-x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-linux-x86_64
          path: dist
      - run: pip install --no-index --find-links dist VecturaDB
      - uses: ./.github/actions/preload-default-onnx-model
      - name: Test
        env:
          CHROMA_RUST_BINDINGS_TEST_ONLY: "1"
          RUST_BACKTRACE: 1
        run: >-
          python -m pytest -x -v --color=yes --durations 10
          chromadb/test/api chromadb/test/test_api.py chromadb/test/test_client.py
          chromadb/test/test_local_sparse_search.py
          chromadb/test/property --ignore-glob chromadb/test/property/test_cross_version_persist.py
          --ignore chromadb/test/property/test_add_mcmr.py
      - name: Smoke test with the CLI server
        # chroma run listens on localhost, which can resolve to ::1 only: the clients call localhost, as users do
        run: |
          chroma run --path ./smoke-data --port 8001 &
          for i in $(seq 1 30); do curl -sf http://localhost:8001/api/v2/heartbeat && break; sleep 2; done
          python vecturadb/smoke.py 8001 localhost
