# On a tag vX.Y.Z or vX.Y.Z-preview.N: the CI builds and tests everything with the version of the tag, then the CLI
# binaries and the wheels go to a GitHub Release, the image to ghcr.io/vecturadb/vecturadb, the wheels to PyPI with
# Trusted Publishing (no tokens). A preview is a GitHub prerelease, its image gets the tag preview, never latest.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-preview\.[0-9]+)?$ ]]; then
            echo "Tag $TAG is not vX.Y.Z or vX.Y.Z-preview.N"; exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-preview.* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.version }}

  image:
    needs: [version, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-linux-*
          merge-multiple: true
      - name: Context
        run: |
          mkdir ctx
          cp vecturadb/docker/Dockerfile vecturadb/docker/config.yaml ctx/
          cp vecturadb-linux-x86_64 ctx/vecturadb-amd64 && cp vecturadb-linux-aarch64 ctx/vecturadb-arm64 && chmod +x ctx/vecturadb-*
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push amd64 and arm64
        env:
          IMAGE: ghcr.io/vecturadb/vecturadb
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.prerelease == 'true' && 'preview' || 'latest' }}
          DESCRIPTION: "Vector database compatible with the Chroma API. Independent project. Not affiliated with, endorsed by or sponsored by Chroma Inc. CHROMA is a registered trademark of Chroma Inc., used here only to describe compatibility."
        run: >-
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg REVISION=${{ github.sha }}
          --annotation "index:org.opencontainers.image.description=$DESCRIPTION"
          -t "$IMAGE:$VERSION" -t "$IMAGE:$CHANNEL" --push ctx

  github-release:
    needs: [version, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          ls -la dist
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "${{ github.repository }}" --title "VecturaDB ${{ needs.version.outputs.version }}" --generate-notes "${flags[@]}" dist/*

  pypi:
    needs: [version, ci]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/VecturaDB/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1 (v1.14.3)
        with:
          packages-dir: dist
