# On a tag vX.Y.Z, vX.Y.Z-preview.N or vX.Y.Z-preview.N.postM: the CI builds and tests everything with the version of
# the tag, then the CLI binaries and the wheels go to a GitHub Release, the image to ghcr.io/vecturadb/vecturadb, the
# wheels to PyPI with Trusted Publishing (no tokens). A preview is a GitHub prerelease, its image gets the tag preview,
# never latest.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-preview\.[0-9]+(\.post[0-9]+)?)?$ ]]; then
            echo "Tag $TAG is not vX.Y.Z, vX.Y.Z-preview.N or vX.Y.Z-preview.N.postM"; exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-preview.* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.version }}

  image:
    needs: [version, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: cli-linux-*
          merge-multiple: true
      - name: Context
        run: |
          mkdir ctx
          cp vecturadb/docker/Dockerfile vecturadb/docker/config.yaml ctx/
          cp vecturadb-linux-x86_64 ctx/vecturadb-amd64 && cp vecturadb-linux-aarch64 ctx/vecturadb-arm64 && chmod +x ctx/vecturadb-*
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push amd64 and arm64
        env:
          IMAGE: ghcr.io/vecturadb/vecturadb
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.prerelease == 'true' && 'preview' || 'latest' }}
          DESCRIPTION: "Vector database compatible with the Chroma API. Independent project. Not affiliated with, endorsed by or sponsored by Chroma Inc. CHROMA is a registered trademark of Chroma Inc., used here only to describe compatibility."
        run: >-
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg REVISION=${{ github.sha }}
          --annotation "index:org.opencontainers.image.description=$DESCRIPTION"
          -t "$IMAGE:$VERSION" -t "$IMAGE:$CHANNEL" --push ctx

  github-release:
    needs: [version, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          ls -la dist
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "${{ github.repository }}" --title "VecturaDB ${{ needs.version.outputs.version }}" --generate-notes "${flags[@]}" dist/*

  pypi:
    needs: [version, ci]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/VecturaDB/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1 (v1.14.3)
        with:
          packages-dir: dist
