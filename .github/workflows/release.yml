# On a tag vX.Y.Z, vX.Y.Z-preview.N or vX.Y.Z-preview.N.postM: the CI builds and tests everything with the version of
# the tag, then the CLI binaries and the wheels go to a GitHub Release, the image to ghcr.io/vecturadb/vecturadb, the
# wheels to PyPI with Trusted Publishing (no tokens). A preview is a GitHub prerelease, its image gets the tag preview,
# never latest.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-preview\.[0-9]+(\.post[0-9]+)?)?$ ]]; then
            echo "Tag $TAG is not vX.Y.Z, vX.Y.Z-preview.N or vX.Y.Z-preview.N.postM"; exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-preview.* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.version }}

  # The image is built from the source as Chroma builds its official one (.github/workflows/_build_release_container.yml
  # of Chroma), with vecturadb/docker/Dockerfile: each architecture on a runner of its own, without emulation, pushed with
  # a tag of its architecture; then one tag for both.
  image:
    name: Image (${{ matrix.arch }})
    needs: [version, ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # As the jobs of the CLI: the binary of the image tells the version of the release (vecturadb --version, and the
      # block server of /api/v2/pre-flight-checks).
      - name: CLI version from the release tag
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: perl -0pi -e 's/^version = ".*"/version = "$ENV{VERSION}"/m' rust/cli/Cargo.toml && grep -m1 '^version' rust/cli/Cargo.toml
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push ${{ matrix.arch }}
        env:
          IMAGE: ghcr.io/vecturadb/vecturadb
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker pull --platform "linux/${{ matrix.arch }}" rust:1.92.0
          docker pull --platform "linux/${{ matrix.arch }}" debian:stable-slim
          docker buildx build --platform "linux/${{ matrix.arch }}" -f vecturadb/docker/Dockerfile \
            --build-arg REVISION=${{ github.sha }} -t "$IMAGE:$VERSION-${{ matrix.arch }}" --push .

  image-manifest:
    needs: [version, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: One tag for amd64 and arm64
        env:
          IMAGE: ghcr.io/vecturadb/vecturadb
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.prerelease == 'true' && 'preview' || 'latest' }}
          DESCRIPTION: "Vector database compatible with the Chroma API. Independent project. Not affiliated with, endorsed by or sponsored by Chroma Inc. CHROMA is a registered trademark of Chroma Inc., used here only to describe compatibility."
        run: |
          docker buildx imagetools create --annotation "index:org.opencontainers.image.description=$DESCRIPTION" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:$CHANNEL" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  github-release:
    needs: [version, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          ls -la dist
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "${{ github.repository }}" --title "VecturaDB ${{ needs.version.outputs.version }}" --generate-notes "${flags[@]}" dist/*

  pypi:
    needs: [version, ci]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/VecturaDB/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1 (v1.14.3)
        with:
          packages-dir: dist
