# Changed from the original Chroma file; see the git history for the changes and their authors.
name: 🐛 Bug Report
description: File a bug report to help us improve VecturaDB
title: "[Bug]: "
labels: ["bug", "triage"]
# assignees:
#   - octocat
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
#       value: "A bug happened!"
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Your VecturaDB, Python, and OS versions, how you run VecturaDB (Python package, Docker image or CLI), and whatever else you think relevant. Check that you have [the latest release](https://github.com/VecturaDB/VecturaDB/releases).
      placeholder: VecturaDB 1.0.0-preview.1, Python 3.12, macOS 15, Docker image
#       value: "A bug happened!"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell
